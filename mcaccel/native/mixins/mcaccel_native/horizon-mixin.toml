# mcaccel: a mixin bundle, the rules half of Minecraft Accelerated 1.0.0 (pumpkinsAccelerated,
# mari, CC0-1.0). The 28 pumpkins are the content mod mods/mcaccel (tools/mcaccel_port.py).
# - shears used on a carved pumpkin or jack o'lantern (vanilla's or the mod's) turn it to the
#   next face (CarvedPumpkinModifier.onUse), and hitting one with shears turns it back
#   (LeftClickPumpkinEvent);
# - the mod's pumpkins make snow and iron golems (CarvedPumpkinModifier's predicate);
# - endermen don't mind a player wearing one of the carved faces (EndermanIgnorePumpkins);
# - wearing one shows its own blur (AddNewPumpkinOverlays).
[mod]
id = "mcaccel_native"
version = "0.1.0"

[compatibility]
horizon_revision = "3fb4c3138e0c5d8fdd2fdb555cf31368e8897497"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "mcaccel"
source = "runtime.rs"

# CarvedPumpkinModifier.onUse: where PumpkinBlock.useItemOn is tried (shears on a block, after
# the sneaking check), a pumpkin of the cycle turns to the next face.
[[injection]]
id = "shears_use"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::pumpkin::Game<'_>::use_pumpkin"
helper = "shears_use.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "at", ty = "[i32; 3]", value = "pos" },
  { name = "side", ty = "[i32; 3]", value = "face" },
]

# LeftClickPumpkinEvent (AttackBlockCallback, PASS): the previous face; the attack goes on.
[[injection]]
id = "shears_attack"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_left_click_block"
helper = "shears_attack.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "at", ty = "[i32; 3]", value = "pos" },
  { name = "side", ty = "[i32; 3]", value = "face" },
]

# CarvedPumpkinBlock's golem head predicate with BlockInit.PUMPKIN_BLOCKS.
[[injection]]
id = "golem_head"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::golems::Game<'_>::is_golem_head"
helper = "golem_head.rs"
bindings = [
  { name = "game", ty = "&Game<'_>", value = "&*self" },
  { name = "at", ty = "[i32; 3]", value = "p" },
]

# EndermanIgnorePumpkins: isPlayerStaring is false under the nine carved faces.
[[injection]]
id = "enderman"
kind = "HEAD"
cancellable = true
target = "horizon_client_lib::mobs::enderman::stared_at"
helper = "enderman.rs"
bindings = [
  { name = "world", ty = "&MobWorld<'_>", value = "w" },
]

# AddNewPumpkinOverlays: the worn face's own blur instead of none.
[[injection]]
id = "overlay"
kind = "MODIFY_VARIABLE"
target = "horizon_client::game::render_tick::Game<'_>::screen_quads"
variable = { name = "overlays", ordinal = 0, at = "STORE" }
require = 1
ordinal = 0
helper = "overlay.rs"
bindings = [
  { name = "value", ty = "hud_overlays::CameraOverlays", value = "$value" },
  { name = "game", ty = "&Game<'_>", value = "&*self" },
]
