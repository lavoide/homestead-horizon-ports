# blockrunner: a mixin bundle (docs/native-mods.md, "A bundle"). Build it with
# `horizon-launcher native-build <this folder> --instance <instance> --trust-native-code`.
#
# Both `speed()` methods of the client's MotionWorld (ground and air movement) return the
# player's movement_speed attribute; here they return it times the factor of the block the
# player stands on. The client simulates its own player's movement, so this needs no command.
[mod]
id = "blockrunner"
version = "0.2.1"

[compatibility]
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/motion.rs"
name = "blockrunner"
source = "runtime.rs"

[[injection]]
id = "ground-speed"
kind = "HEAD"
cancellable = true
target = "horizon_client_lib::motion::<MotionWorld<'_,'_,'_> as LivingMotionWorld>::speed"
helper = "speed.rs"
bindings = [{ name = "world", ty = "&mut MotionWorld<'_, '_, '_>", value = "&mut *self" }]

[[injection]]
id = "air-speed"
kind = "HEAD"
cancellable = true
target = "horizon_client_lib::motion::<MotionWorld<'_,'_,'_> as LivingAirWorld>::speed"
helper = "speed.rs"
bindings = [{ name = "world", ty = "&mut MotionWorld<'_, '_, '_>", value = "&mut *self" }]
