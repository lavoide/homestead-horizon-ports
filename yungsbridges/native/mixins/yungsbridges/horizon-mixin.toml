# yungsbridges: a mixin bundle for YUNG's Bridges 4.0.3 (YungNickYoung, LGPLv3): bridges over
# rivers, placed after generation (runtime.rs). The templates and the bridge list are
# bridge_data.rs, written by tools/yungsbridges_port.py from the carry.
[mod]
id = "yungsbridges"
version = "0.1.0"

[compatibility]
horizon_revision = "3fb4c3138e0c5d8fdd2fdb555cf31368e8897497"

[[module]]
id = "data"
file = "crates/horizon-client/src/game.rs"
name = "yungsbridges_data"
source = "bridge_data.rs"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "yungsbridges"
source = "runtime.rs"

# A newly generated overworld chunk waits for its bridge.
[[injection]]
id = "chunk"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_chunk_load"
helper = "chunk.rs"
bindings = [
  { name = "dimension", ty = "&str", value = "dimension" },
  { name = "chunk", ty = "[i32; 2]", value = "chunk" },
  { name = "new", ty = "bool", value = "new" },
]

# Each server tick: queued chunks whose surroundings are loaded.
[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tick"
helper = "tick.rs"
bindings = [{ name = "game", ty = "&mut Game<'_>", value = "&mut *self" }]
