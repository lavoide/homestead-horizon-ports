# armorstatues: Armor Statues 8.0.6 (Fuzs, MPL-2.0) for Horizon, as a native trait mod
# (docs/native-mods.md, "Trait mods" and "Server menus"). Sneak and use an armor stand with an
# empty hand: a chest menu edits it (style, poses, rotations, position, alignments). A server menu
# needs nothing on the player's side, so LAN guests and vanilla clients get it too.
[mod]
id = "armorstatues"
version = "0.1.0"

[compatibility]
horizon_revision = "3fb4c3138e0c5d8fdd2fdb555cf31368e8897497"

[api]
path = "api"
