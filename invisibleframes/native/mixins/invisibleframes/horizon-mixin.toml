# invisibleframes: a mixin bundle. As Invisible Frames 1.1.0 (Roundaround): sneak and use an item
# frame to toggle its invisibility (the item in it stays drawn); hitting a frame makes it visible
# again before the hit does what it always does.
[mod]
id = "invisibleframes"
version = "0.1.1"

[compatibility]
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

[[injection]]
id = "toggle"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::frames::Game<'_>::interact_frame"
helper = "toggle.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "target", ty = "Option<InteractTarget>", value = "target" },
]

[[injection]]
id = "show-on-hit"
kind = "HEAD"
target = "horizon_client::game::frames::Game<'_>::attack_frame"
helper = "show.rs"
bindings = [{ name = "game", ty = "&mut Game<'_>", value = "&mut *self" }]
