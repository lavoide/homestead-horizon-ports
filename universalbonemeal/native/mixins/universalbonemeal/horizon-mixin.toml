# universalbonemeal: a mixin bundle. As Universal Bone Meal 8.0.1 (Fuzs, MPL-2.0) with Homestead's
# config (every option on): bone meal also works on cactus, sugar cane, vines, nether wart, fully
# grown melon and pumpkin stems, lily pads, dead bushes, small flowers, coral (warm ocean), chorus,
# mycelium, dirt beside grass or mycelium, podzol and spore blossoms.
#
# Horizon asks a level's `native_is_valid_bonemeal_target` before vanilla's own BonemealableBlock,
# as the Java mod's BonemealCallback runs before vanilla. The behaviours are in the game-side module
# `crate::game::universalbonemeal`, which uses horizon-world's public Behaviours API to set blocks,
# random-tick and check survival.
[mod]
id = "universalbonemeal"
version = "0.1.1"

[compatibility]
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "universalbonemeal"
source = "runtime.rs"

[[injection]]
id = "valid"
kind = "HEAD"
target = "horizon_client::game::native_hooks::GameLevel<'_>::native_is_valid_bonemeal_target"
helper = "valid.rs"
bindings = [
  { name = "level", ty = "&GameLevel<'_>", value = "self" },
  { name = "pos", ty = "BlockPos", value = "pos" },
  { name = "state", ty = "BlockStateId", value = "state" },
  { name = "valid", ty = "&mut Option<bool>", value = "valid" },
]

[[injection]]
id = "success"
kind = "HEAD"
target = "horizon_client::game::native_hooks::GameLevel<'_>::native_is_bonemeal_success"
helper = "success.rs"
bindings = [
  { name = "level", ty = "&mut GameLevel<'_>", value = "self" },
  { name = "pos", ty = "BlockPos", value = "pos" },
  { name = "state", ty = "BlockStateId", value = "state" },
  { name = "success", ty = "&mut bool", value = "success" },
]

[[injection]]
id = "perform"
kind = "HEAD"
target = "horizon_client::game::native_hooks::GameLevel<'_>::native_perform_bonemeal"
helper = "perform.rs"
bindings = [
  { name = "level", ty = "&mut GameLevel<'_>", value = "self" },
  { name = "ticks", ty = "&mut Ticks", value = "ticks" },
  { name = "pos", ty = "BlockPos", value = "pos" },
  { name = "state", ty = "BlockStateId", value = "state" },
]
