# farmersdelight: the Java half of Farmer's Delight 2.4.1+refabricated (vectorwing,
# MehVahdJukaar, MerchantPug; MIT) for the content mod mods/farmersdelight
# (tools/farmersdelight_port.py), with Homestead's farmersdelight-common.toml. All of it is the
# game module `runtime.rs` (crate::game::farmersdelight), reached by HEAD injections on Horizon's
# native hooks: the machines' block entities, ticks, slots, drawing and the cooking pot's screen;
# the blocks' right clicks; seeds, rope and tilling; the crops' and soils' random ticks, bone
# meal, survival and placement; the foods' effects.
[mod]
id = "farmersdelight_native"
version = "0.1.0"

[compatibility]
horizon_revision = "3fb4c3138e0c5d8fdd2fdb555cf31368e8897497"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "farmersdelight"
source = "runtime.rs"

[[injection]]
id = "block_entity"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity"
helper = "block_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, Compound)>", value = "&mut *entity" },
]

[[injection]]
id = "ticks"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_ticks"
helper = "ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "&mut *ticks" },
]

[[injection]]
id = "container"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_container"
helper = "container.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "container", ty = "&mut Option<ModContainer>", value = "&mut *container" },
]

[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_tick"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut ModBlockEntity", value = "&mut *entity" },
]

[[injection]]
id = "update_tag"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_update_tag"
helper = "update_tag.rs"
bindings = [
  { name = "entity", ty = "&ModBlockEntity", value = "entity" },
  { name = "tag", ty = "&mut Option<Compound>", value = "&mut *tag" },
]

[[injection]]
id = "submit"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_submit"
helper = "submit.rs"
bindings = [
  { name = "game", ty = "&Game<'_>", value = "&*self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "state", ty = "BlockStateId", value = "state" },
  { name = "entity", ty = "&ModBlockEntity", value = "entity" },
  { name = "draw", ty = "&mut BlockEntityDraw", value = "&mut *draw" },
]

[[injection]]
