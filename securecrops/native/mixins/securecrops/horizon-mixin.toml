# securecrops: a mixin bundle. As Secure Crops 2.0.0 (zekk051) with Homestead's gamerules
# (preferred-gamerules: secureFarmlandAndCrops true, secureFarmlandIfEmpty true,
# secureFarmlandBreakCrops false): no entity tramples farmland, with or without a crop on it.
# Landing on it still hurts as landing on any block does (Block.fallOn).
#
# Farmland's landing rule is read once, from the landing-definitions.json horizon-prepare wrote.
# The trample itself is in a generic function, which horizon-mixins can't target, so this
# loads the definitions with farmland on the default rule instead.
[mod]
id = "securecrops"
version = "0.1.0"

[compatibility]
horizon_revision = "3fb4c3138e0c5d8fdd2fdb555cf31368e8897497"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/landing.rs"
name = "securecrops"
source = "runtime.rs"

# BlockLandingRegistry::new returns `io::Result<Self>`, which a cancellable HEAD refuses, so
# the hook is on the client's loader of the definitions.
[[injection]]
id = "no-trample"
kind = "HEAD"
cancellable = true
target = "horizon_client_lib::landing::load"
helper = "secure.rs"
bindings = [
  { name = "root", ty = "&Path", value = "root" },
  { name = "properties", ty = "&MovementProperties<'_>", value = "properties" },
]
