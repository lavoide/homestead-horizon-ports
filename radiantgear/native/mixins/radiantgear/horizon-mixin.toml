# radiantgear: Radiant Gear 2.1.6 (Illusive Soulworks, LGPL-3.0-or-later). Worn trinkets that glow
# light up with Horizon Extras' dynamic lights. It reads native/trinkets' `trinkets:worn` player
# attachment and needs none of its code. ITEM_LIGHTS (radiantgear_data.rs) is written by
# tools/trinkets_port.py.
[mod]
id = "radiantgear"
version = "0.1.1"

[compatibility]
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

[[module]]
id = "data"
file = "crates/horizon-client/src/game.rs"
name = "radiantgear_data"
source = "radiantgear_data.rs"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "radiantgear"
source = "runtime.rs"


# Radiant Gear: a worn trinket that glows lights up (Horizon Extras' dynamic lights).
[[injection]]
id = "lights"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::dynamic_lights::Game<'_>::gather_dynamic_lights"
helper = "lights.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "camera", ty = "glam::DVec3", value = "camera" },
  { name = "alpha", ty = "f64", value = "alpha" },
]
