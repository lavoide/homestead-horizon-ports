# sootychimneys: the rules half of Sooty Chimneys 1.3.4 (mortuusars) with Homestead's
# sootychimneys-common.toml (SmokeFlow 0.75, DirtyChance 0.05, Wind on, WindStrength 1.0).
# The fourteen chimneys are the content mod mods/sootychimneys (tools/sootychimneys_port.py).
# - api (trait mod): every chimney has a ticking block entity (ChimneyBlockEntity). Its server
#   tick keeps `lit` (no redstone signal) and `stacked` (a chimney above) as
#   ChimneyBlock.updateState does, cleans a dirty chimney that gets stacked, dirties a clean one
#   that smokes at the random-tick rate times DirtyChance, and sends the smoke (the client
#   particleTick there) with the wind (Wind.update, one wind for the server);
# - runtime (Game): ChimneyBlock.use, an empty main hand toggles `blocked`, an axe scrapes a
#   dirty chimney clean (soot_scraping: black dye at its chance).
[mod]
id = "sootychimneys_native"
version = "0.1.0"

[compatibility]
horizon_revision = "3fb4c3138e0c5d8fdd2fdb555cf31368e8897497"

[api]
path = "api"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "sootychimneys"
source = "runtime.rs"

# ChimneyBlock.use, before the block's own use and the item's.
[[injection]]
id = "use"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::native_hooks::Game<'_>::native_right_click_block"
helper = "use.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "at", ty = "[i32; 3]", value = "pos" },
  { name = "side", ty = "[i32; 3]", value = "face" },
  { name = "taken", ty = "&mut bool", value = "&mut *canceled" },
]
