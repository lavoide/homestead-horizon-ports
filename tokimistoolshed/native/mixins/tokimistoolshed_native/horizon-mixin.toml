# tokimistoolshed: a mixin bundle, the rules half of Tokimi's Toolshed 1.8 (Cozy Studios). The
# items are the content mod mods/tokimistoolshed (tools/tokimistoolshed_port.py). runtime.rs
# has the rules; each hook below hands over to it.
[mod]
id = "tokimistoolshed_native"
version = "0.1.0"

[compatibility]
horizon_revision = "3fb4c3138e0c5d8fdd2fdb555cf31368e8897497"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "tokimistoolshed"
source = "runtime.rs"

# LastBreakData.setFace (AttackBlockCallback): the face a block was hit on.
[[injection]]
id = "face"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_left_click_block"
helper = "face.rs"
bindings = [
  { name = "at", ty = "[i32; 3]", value = "pos" },
  { name = "side", ty = "[i32; 3]", value = "face" },
]

# HammerItem / ExcavatorItem / ScytheItem / ClippersItem / LumberAxeItem.postMine: the block
# breaks (the call re-enters break_block), then the area or the tree.
[[injection]]
id = "area"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::Game<'_>::break_block"
helper = "area.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "at", ty = "[i32; 3]", value = "pos" },
]

# ScytheItem.useOnBlock: a till that worked tills the 3x3.
[[injection]]
id = "till"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::Game<'_>::use_block_transformer"
helper = "till.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&ItemStack", value = "stack" },
  { name = "at", ty = "[i32; 3]", value = "pos" },
  { name = "side", ty = "[i32; 3]", value = "face" },
]

# CopperBucketItem.use and CopperBucketBehaviors' cauldrons: the vanilla bucket's use, with wear.
[[injection]]
id = "bucket"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::Game<'_>::use_tool"
helper = "bucket.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&ItemStack", value = "stack" },
  { name = "allow", ty = "bool", value = "allow_block_actions" },
]

# CowMilkMixin: a copper bucket milks a cow.
[[injection]]
id = "milk"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::creatures::Game<'_>::interact_mob"
helper = "milk.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "target", ty = "Option<InteractTarget>", value = "target" },
]

# CopperMilkBucketItem.finishUsing: the bucket back with its wear.
[[injection]]
id = "drink"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::consume::Game<'_>::finish_consuming"
helper = "drink.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "info", ty = "&ItemInfo", value = "info" },
  { name = "consumable", ty = "&ItemConsumable", value = "consumable" },
  { name = "stack", ty = "&ItemStack", value = "stack" },
]

# ShearsLootMixin: clippers roll block loot as shears.
[[injection]]
id = "loot"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::Game<'_>::block_loot_at"
helper = "loot.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "at", ty = "[i32; 3]", value = "pos" },
  { name = "state", ty = "BlockStateId", value = "state" },
  { name = "held", ty = "Option<&ItemStack>", value = "held" },
  { name = "entity", ty = "&Option<horizon_world::nbt::Tag>", value = "&block_entity" },
]

# TrowelItem, ChiselItem and AbacusItem.useOnBlock (and the chisel's mode switch).
[[injection]]
id = "hand"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::Game<'_>::use_hand"
helper = "hand.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "hit", ty = "Option<&Hit>", value = "block_hit" },
]

# AbacusHudRenderer: the counts over the hotbar.
[[injection]]
id = "abacus"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_player_tick"
helper = "abacus.rs"
bindings = [{ name = "game", ty = "&mut Game<'_>", value = "&mut *self" }]
